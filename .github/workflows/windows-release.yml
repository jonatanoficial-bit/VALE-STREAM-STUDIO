name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm dist
      - shell: pwsh
        run: Get-FileHash release\* -Algorithm SHA256 | Format-Table -AutoSize | Out-File -Encoding utf8 release\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vale-stream-studio-windows
          path: release
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
